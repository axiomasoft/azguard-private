# Source: anonymized production project
# Mutation gate for test quality CI.
# Two launch strategies: increment by PR (fast) + full run on main (advisory).
name: Mutation Testing

on:
  pull_request:        # increment: mutate only changed lines
  push:
    branches: [main]   # full run with merge — advisory, is not a blocker
  workflow_dispatch:   # manual start of full run

jobs:
  infection:
    name: Infection (MSI gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for --git-diff-lines

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: xdebug          # coverage driver is required for Infection
          tools: composer:v2
        env:
          XDEBUG_MODE: coverage

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # The coverage is generated in a separate step and reused in Infection,
      # to avoid running the entire test suite twice.
      - name: Generate coverage
        run: vendor/bin/pest --coverage-xml=build/coverage/xml --min=0
        env:
          XDEBUG_MODE: coverage

      # PR: mutate only diff to origin/main — we keep the bar on the new code.
      - name: Infection (incremental, on PR)
        if: github.event_name == 'pull_request'
        run: |
          vendor/bin/infection \
            --git-diff-lines \
            --git-diff-base=origin/main \
            --threads=4 \
            --min-msi=70 \
            --min-covered-msi=80 \
            --coverage=build/coverage/xml \
            --no-progress

      # main / manual: full run. Expensive - because advisory, out PR-locks.
      - name: Infection (full, on main)
        if: github.event_name != 'pull_request'
        run: |
          vendor/bin/infection \
            --threads=4 \
            --min-msi=70 \
            --min-covered-msi=80 \
            --coverage=build/coverage/xml \
            --no-progress
