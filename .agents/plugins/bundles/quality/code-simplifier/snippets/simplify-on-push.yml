# Template for target project: .github/workflows/simplify-on-push.yml
# Background simplification agent: runs checklist code-simplifier by diff PR
# and leaves suggestions as comments. Nothing commits or merges.
#
# Requirements:
# - secret ANTHROPIC_API_KEY (paid tokens - see. docs/workflows/background-agents)
# - installed skill code-simplifier (install.sh or plugin marketplace)
name: Code Simplifier

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '**.php'

concurrency:
  group: simplify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simplify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run code-simplifier review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Applied skill code-simplifier to the diff of this PR
            (git diff origin/${{ github.base_ref }}...HEAD).

            Rules:
            - Simplification suggestions only, no behavior changes.
            - Do not suggest changes to business logic and new dependencies.
            - Each sentence - with a file, a line and a rationale.
            - If there is nothing to simplify, write it in one line.

            Leave the result in a comment PR.
