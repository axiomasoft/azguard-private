# Source: anonymized production project
# CI-step E2E: installation of browsers, isolated test database as service,
# migrations, run Playwright with env-isolation, report publication/traces when crashed.
# Fragment for GitHub Actions (job in .github/workflows/e2e.yml).
name: e2e

on: [push, pull_request]

jobs:
  playwright:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16            # or mysql:8 — under the project stack
        env:
          POSTGRES_DB: app_e2e        # separate test base, NOT combat
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      CI: 'true'
      E2E_BASE_URL: http://127.0.0.1:8000
      # Data isolation/media - webServer will pass this on to the elevated application.
      DB_DATABASE: app_e2e
      DB_HOST: 127.0.0.1
      MEDIA_DISK: media-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      # Browser cache between runs + installation of only the required engine.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Preparing a test database (migrations/siding). Team - under the project stack.
      - name: Prepare test database
        run: npm run migrate:e2e

      # webServer from playwright.config will launch the application itself.
      - name: Run E2E
        run: npx playwright test

      # Artifacts for analyzing crashes: HTML-report, traces, screenshots, video.
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
