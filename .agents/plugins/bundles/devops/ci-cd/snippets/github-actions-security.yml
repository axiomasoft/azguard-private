# .github/workflows/security.yml
# Security-gates: dependency audit (PHP + JS) and a scan of the assembled image.
# Principle: block merge only on HIGH/CRITICAL; LOW/MEDIUM — to the log, not to the block.
# SAST (PHPStan/psalm taint) lives mostly lint-job — see skill php/static-analysis.

name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # weekly re-scan: new CVE on old code

permissions:
  contents: read

jobs:
  deps-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # composer audit — known CVE in PHP-dependencies. --no-dev: only runtime graph.
      - name: composer audit
        run: composer audit --no-dev --format=plain

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm audit gate on high; --omit=dev removes noise dev-dependencies.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is assembled in the same way as in build-job (see devops/docker-php).
      - name: Build image
        run: docker build -t app:scan .

      # Trivy: CVE in base-OS layers and packages. exit-code=1 only on CRITICAL/HIGH.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
