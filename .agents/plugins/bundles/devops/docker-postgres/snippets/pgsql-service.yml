# Source: anonymized production Laravel project
# Service PostgreSQL: healthcheck pg_isready, named volume data,
# init-scripts in /docker-entrypoint-initdb.d (work ONLY when created for the first time volume).
services:
  pgsql:
    image: postgres:16-alpine
    container_name: app_pgsql
    restart: unless-stopped
    ports:
      # Only loopback host - do not publish the database externally
      - "127.0.0.1:${PGSQL_PORT:-5432}:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
      # init-scripts (creation <app>_test etc.) are executed once,
      # when initializing empty for the first time volume
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      # $$ — escaping for compose: variable is expanded inside the container
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

# DB consumers:
#   depends_on:
#     pgsql: { condition: service_healthy }

volumes:
  pgsql_data:
