# Source: anonymized production Laravel project
# Local overrides Docker Compose (are not committed).
#
# Copy to the repository root:
#   cp docker-compose.override.example.yml docker-compose.override.yml
#
# When needed:
# - WSL2 / Linux with bind-mount: vite should write to ./ from uid host,
#   otherwise Permission denied on node_modules and generated files.
# - On «clean» Linux without override vite works like www-data — file is optional.
#
# PUID/PGID in .env.docker must match id -u / id -g on the host.

services:
  vite:
    user: "1000:1000"
    command:
      [
        "sh",
        "-lc",
        "pnpm run dev",
      ]
