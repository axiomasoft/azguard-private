# Source: anonymized production Laravel project
# Vite dev server separate service compose. Uses the same image as app
# (PHP-image with Node.js + pnpm), therefore env-anchor *app_env is reused as is.
services:
  vite:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: app_vite
    restart: unless-stopped
    working_dir: /var/www/html
    # pnpm install at each start: node_modules lives in named volume;
    # --host=0.0.0.0 required - otherwise dev-server listens only loopback container.
    command: ["sh", "-lc", "pnpm install && pnpm run dev --host=0.0.0.0 --port=${VITE_PORT:-5173}"]
    volumes:
      - ./:/var/www/html
      # node_modules — named volume, NOT bind-mount: speed I/O and insulation
      # binary host dependencies (WSL2/macOS).
      - vite_node_modules:/var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    environment: *app_env
    depends_on:
      app: { condition: service_healthy }
    networks:
      - app_network

# In the root section volumes compose-file:
volumes:
  vite_node_modules:

# WSL2/Linux when Permission denied on node_modules — in docker-compose.override.yml:
#   services:
#     vite:
#       user: "1000:1000"
