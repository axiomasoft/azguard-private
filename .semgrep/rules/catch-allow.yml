rules:
  - id: azguard.catch-allow
    languages: [php]
    severity: ERROR
    message: >-
      A catch block of `Throwable` or `Exception` returns an allowing result. An error while deciding must deny (fail
      closed): return `false` or a deny decision, or rethrow.
    pattern-either:
      - pattern: |
          try {
            ...
          } catch (Throwable $E) {
            ...
            return true;
            ...
          }
      - pattern: |
          try {
            ...
          } catch (Throwable $E) {
            ...
            return Decision::allow(...);
            ...
          }
      - pattern: |
          try {
            ...
          } catch (Throwable $E) {
            ...
            return Effect::Allow;
            ...
          }
      - pattern: |
          try {
            ...
          } catch (\Throwable $E) {
            ...
            return true;
            ...
          }
      - pattern: |
          try {
            ...
          } catch (\Throwable $E) {
            ...
            return Decision::allow(...);
            ...
          }
      - pattern: |
          try {
            ...
          } catch (\Throwable $E) {
            ...
            return Effect::Allow;
            ...
          }
      - pattern: |
          try {
            ...
          } catch (Exception $E) {
            ...
            return true;
            ...
          }
      - pattern: |
          try {
            ...
          } catch (Exception $E) {
            ...
            return Decision::allow(...);
            ...
          }
      - pattern: |
          try {
            ...
          } catch (Exception $E) {
            ...
            return Effect::Allow;
            ...
          }
      - pattern: |
          try {
            ...
          } catch (\Exception $E) {
            ...
            return true;
            ...
          }
      - pattern: |
          try {
            ...
          } catch (\Exception $E) {
            ...
            return Decision::allow(...);
            ...
          }
      - pattern: |
          try {
            ...
          } catch (\Exception $E) {
            ...
            return Effect::Allow;
            ...
          }
