services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PGSQL_PORT:-5432}:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${PGSQL_DATABASE:-azguard_test}
      POSTGRES_USER: ${PGSQL_USERNAME:-azguard}
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD:-azguard}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-azguard_test}
      MYSQL_USER: ${MYSQL_USERNAME:-azguard}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-azguard}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-azguard}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MARIADB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-azguard_test}
      MARIADB_USER: ${MARIADB_USERNAME:-azguard}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-azguard}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-azguard}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  authority-primary:
    profiles: [authority-replica]
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${AUTHORITY_PRIMARY_PORT:-25433}:5432"
    environment:
      POSTGRES_DB: azguard_authority_test
      POSTGRES_USER: authority_test
      POSTGRES_PASSWORD: authority_test
    command: [postgres, -c, wal_level=replica, -c, max_wal_senders=4, -c, wal_keep_size=128MB]
    volumes:
      - authority_primary_test:/var/lib/postgresql/data
      - ./tests/Engines/Support/replica-primary.sh:/docker-entrypoint-initdb.d/replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U authority_test -d azguard_authority_test"]
      interval: 1s
      timeout: 5s
      retries: 30

  authority-replica:
    profiles: [authority-replica]
    image: postgres:16-alpine
    depends_on:
      authority-primary:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AUTHORITY_REPLICA_PORT:-25434}:5432"
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: authority_test
    entrypoint: [sh, /replica-standby.sh]
    volumes:
      - authority_replica_test:/var/lib/postgresql/data
      - ./tests/Engines/Support/replica-standby.sh:/replica-standby.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U authority_test -d azguard_authority_test -tAc 'select pg_is_in_recovery()' | grep -qx t"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  authority_primary_test:
  authority_replica_test:
  pgsql_data:
  mysql_data:
  redis_data:
  mariadb_data:
