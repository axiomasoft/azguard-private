# Negative fixture for rule dangerous-trigger: valid except for this one rule. Not under .github/, so GitHub never runs it.
name: Fixture

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  contents: read

defaults:
  run:
    shell: bash


jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
