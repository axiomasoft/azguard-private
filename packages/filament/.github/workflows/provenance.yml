name: Filament provenance disabled

# Filament is not published. No staging ref can invoke a producer here.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  blocked:
    name: Block unpublished Filament provenance
    runs-on: ubuntu-latest
    steps:
      - name: Block unpublished package
        run: |
          set -Eeuo pipefail
          echo '::error::Filament provenance is disabled because the package is not published.'
          exit 1
