# actionlint 1.7.12 predates GitHub's $/ same-repository workflow syntax.
# Keep this limited to the known callers and exact allowlisted workflow names;
# bin/check-workflow-pins.py independently validates these references.
paths:
  .github/workflows/release.yml:
    ignore:
      - '^reusable workflow call "\$/\.github/workflows/(tests|static-analysis|code-style|docs|tests-nightly|compatibility|workers|security|codeql|zizmor|secret-scan|split)\.yml" at "uses" is not following the format '
  .github/workflows/docs-deploy.yml:
    ignore:
      - '^reusable workflow call "\$/\.github/workflows/docs\.yml" at "uses" is not following the format '
