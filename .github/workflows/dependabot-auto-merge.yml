name: Disable Dependabot auto-merge

on:
  # zizmor: ignore[dangerous-triggers] -- Base-branch workflow only; no PR checkout or execution. The pin checker locks the complete privileged job.
  pull_request_target:
    types: [opened, synchronize, reopened, auto_merge_enabled]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  auto-merge:
    name: Disable auto-merge on Dependabot PR
    runs-on: ubuntu-latest
    concurrency:
      group: dependabot-auto-merge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository
    permissions:
      pull-requests: write

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Disable Dependabot auto-merge
        if: always()
        run: |
          set -Eeuo pipefail
          enabled=$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')
          if [[ "$enabled" == true ]]; then
            gh pr merge --disable-auto "$PR_URL"
          fi
          [[ "$META_RESULT" == success ]]
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_RESULT: ${{ steps.meta.outcome }}

  sweep:
    name: Disable existing Dependabot auto-merge requests
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Reconcile open Dependabot PRs
        run: |
          set -Eeuo pipefail
          numbers=$(gh api --paginate "repos/$REPOSITORY/pulls?state=open&per_page=100" --jq '.[] | select(.user.login == "dependabot[bot]") | .number')
          for number in $numbers; do
            [[ "$number" =~ ^[0-9]+$ ]]
            enabled=$(gh pr view "$number" --repo "$REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')
            if [[ "$enabled" == true ]]; then
              gh pr merge --disable-auto "$number" --repo "$REPOSITORY"
            fi
          done
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
