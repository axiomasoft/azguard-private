name: Worker lifecycle

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '31 2 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      memory:
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: zip, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none
      - name: Validate outcome and memory checkers
        run: |
          set -Eeuo pipefail
          php tests/Fixtures/Workers/test-verify.php
          php tests/Fixtures/Workers/test-memory-check.php
      - name: Exercise persistent workers
        env:
          WORKER_EVENT: ${{ github.event_name }}
          WORKER_MEMORY: ${{ inputs.memory }}
        run: |
          set -Eeuo pipefail
          if [[ "$WORKER_EVENT" == 'schedule' || "$WORKER_MEMORY" == 'true' || "$WORKER_EVENT" == 'workflow_dispatch' ]]; then
            bash bin/worker-smoke.sh memory
          else
            bash bin/worker-smoke.sh smoke
          fi
      - name: Retain series and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-lifecycle-${{ github.run_id }}
          path: build/worker-smoke/
          if-no-files-found: error
