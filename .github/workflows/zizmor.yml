name: Zizmor

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Audit workflows
        run: bash bin/security-tools.sh zizmor -- --persona=pedantic --min-severity=medium --config=.github/zizmor.yml .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
