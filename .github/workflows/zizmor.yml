name: Zizmor

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Scope: root and split-package GitHub Actions workflows;
      # pedantic findings of medium severity or higher block this control.
      - name: Audit workflows
        id: scan
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/zizmor-results"
          bash bin/security-tools.sh zizmor -- --strict-collection --format=sarif --persona=pedantic --min-severity=medium --config=.github/zizmor.yml .github/workflows/ packages/core/.github/workflows/ > "$RUNNER_TEMP/zizmor-results/zizmor.sarif"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce report and bind it to the checked-out commit
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python3 bin/check-security-results.py --scanner zizmor --outcome "$SCAN_OUTCOME" --sha "$GITHUB_SHA" --report-dir "$RUNNER_TEMP/zizmor-results" --metadata "$RUNNER_TEMP/zizmor-results/metadata.json"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zizmor-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/zizmor-results/
          if-no-files-found: error
