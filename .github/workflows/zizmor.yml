name: Zizmor

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        run: bash bin/security-tools.sh zizmor -- --persona=pedantic --min-severity=medium --config=.github/zizmor.yml .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
