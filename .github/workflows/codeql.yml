name: CodeQL

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # CodeQL extracts GitHub Actions workflows and JavaScript/TypeScript sources,
        # including docs/.vitepress/config.ts. PHP is not a CodeQL language: PHPStan/
        # Larastan, tests, Composer audit and Semgrep are separate controls.
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          category: '/language:${{ matrix.language }}/'
          output: ../codeql-results

      - name: Enforce report and bind it to the checked-out commit
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.analyze.outcome }}
          SCAN_LANGUAGE: ${{ matrix.language }}
        run: python3 bin/check-security-results.py --scanner "codeql-$SCAN_LANGUAGE" --outcome "$SCAN_OUTCOME" --sha "$GITHUB_SHA" --report-dir ../codeql-results --metadata ../codeql-results/metadata.json

      - name: Upload analysis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ../codeql-results/
          if-no-files-found: error
