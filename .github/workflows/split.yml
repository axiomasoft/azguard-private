name: Split packages

# Split publication is disabled by owner decision. The implementation below is
# retained for future review and cannot proceed past the unconditional guard.
# Filament is not distributed by this workflow.

on:
  workflow_call:
    secrets:
      MONOREPO_SPLIT_TOKEN:
        required: true
      RELEASE_SETUP_READ_TOKEN:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  split:
    name: Split ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        package:
          - { dir: core, name: azguard }

    steps:
      - name: Block split publication
        run: |
          set -Eeuo pipefail
          echo '::error::Split publication is disabled by the project owner.'
          exit 1

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare setup verifier dependencies
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, zip
          tools: composer:v2
          coverage: none
      - name: Install locked verifier dependencies
        run: composer install --no-scripts --no-plugins --no-interaction --no-progress --prefer-dist

      - name: Require verified release setup
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETUP_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo '::error::Release setup read token is required.'; exit 1; }
          php bin/prepare-release-setup.php
          php bin/verify-release-evidence.php --setup build/release/setup-request.json

      - name: Split packages/${{ matrix.package.dir }} -> ${{ matrix.package.name }}
        env:
          SPLIT_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}
          PACKAGE: ${{ matrix.package.dir }}
          REPOSITORY: ${{ matrix.package.name }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$PACKAGE:$REPOSITORY" == core:azguard ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          split_sha="$(git subtree split --prefix="packages/$PACKAGE" "$GITHUB_SHA")"
          [[ "$split_sha" =~ ^[0-9a-f]{40}$ ]]
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          printf '#!/bin/sh\nprintf "%%s\\n" "$SPLIT_TOKEN"\n' > "$askpass"
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git push "https://x-access-token@github.com/axiomasoft/$REPOSITORY.git" "$split_sha:refs/heads/release-candidate/$GITHUB_REF_NAME/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
