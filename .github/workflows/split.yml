name: Split packages

# Publishes the monorepo's packages to their standalone, read-only repositories
# after the release workflow validates a tag. Packagist watches those repos (via webhook) and picks up
# the new version automatically. The split repos are what users `composer require`.
# The public release requires the one-time setup in RELEASING.md. Missing setup fails
# the workflow instead of silently creating a release without its Composer packages.
#
# One-time setup (see RELEASING.md):
#   1. Create the two target repos under the org (azguard, azguard-filament).
#   2. Add a MONOREPO_SPLIT_TOKEN secret with push access to them.
#   3. Submit each split repo to Packagist and enable the GitHub webhook.

on:
  workflow_call:
    secrets:
      MONOREPO_SPLIT_TOKEN:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  split:
    name: Split ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        package:
          - { dir: core, name: azguard }
          - { dir: filament, name: azguard-filament }

    steps:
      - name: Require package publishing configuration
        env:
          SPLIT_ENABLED: ${{ vars.SPLIT_ENABLED }}
          MONOREPO_SPLIT_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [[ "$SPLIT_ENABLED" != 'true' || -z "$MONOREPO_SPLIT_TOKEN" ]]; then
            echo '::error::Complete RELEASING.md setup: SPLIT_ENABLED=true and MONOREPO_SPLIT_TOKEN are required.'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Split packages/${{ matrix.package.dir }} -> ${{ matrix.package.name }}
        uses: symplify/monorepo-split-github-action@14e42e2437f674b8987c1f50ca3689116aea1893 # v2.4.5
        env:
          GITHUB_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}
        with:
          tag: ${{ github.ref_name }}
          package_directory: packages/${{ matrix.package.dir }}
          repository_organization: axiomasoft
          repository_name: ${{ matrix.package.name }}
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
