name: Security

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  # release.yml qualifies every tag with this workflow.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Audit locked dependencies
        run: composer audit --locked --format=plain

      - name: Abandoned production packages
        run: composer audit --locked --no-dev --abandoned=fail --format=plain

  osv:
    name: OSV scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Scan lockfiles
        run: bash bin/security-tools.sh osv-scanner -- scan source --lockfile=composer.lock --lockfile=package-lock.json --config=.github/osv-scanner.toml

  npm-audit:
    name: npm audit (docs toolchain)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Audit docs toolchain
        run: npm ci --ignore-scripts && npm audit --audit-level=high

  licenses:
    name: License policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      - name: Check licenses
        run: php bin/license-policy.php

  composer-policy:
    name: Composer plugin and script policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none

      - name: Check plugins and scripts
        run: php bin/composer-policy.php

  semgrep:
    name: Semgrep (AzGuard rules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Test the rules
        run: bash bin/security-tools.sh semgrep -- --test --config=.semgrep/rules/ .semgrep/tests/

      - name: Scan the packages
        run: bash bin/security-tools.sh semgrep -- scan --config=.semgrep/rules/ --error --metrics=off packages/

  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the full history
        run: bash bin/security-tools.sh gitleaks -- git --log-opts=--all --redact --config=.gitleaks.toml .

      - name: Prove the gate detects a synthetic secret
        run: bash bin/test-security-gates.sh

  all:
    name: Security · all gates
    if: always()
    needs: [composer-audit, osv, npm-audit, licenses, composer-policy, semgrep, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -Eeuo pipefail
          for result in $RESULTS; do
            [[ "$result" == success ]] || { echo "::error::a required job ended with $result"; exit 1; }
          done
