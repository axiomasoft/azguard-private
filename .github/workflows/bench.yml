name: Load bench

# Advisory: numbers of shared runners are noisy, so this never gates a merge. Run it by hand to get comparable JSON
# for two refs on the same runner type, or let the weekly run keep the harness exercised on PostgreSQL and Redis.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: Tier (smoke, mini, ci)
        type: choice
        options: [smoke, mini, ci]
        default: mini
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: ${{ matrix.driver }} · ${{ matrix.cache }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: sqlite, cache: none }
          - { driver: pgsql, cache: none }
          - { driver: pgsql, cache: redis }
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: azguard_test
          POSTGRES_USER: azguard
          POSTGRES_PASSWORD: azguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, pdo_pgsql, redis, pcntl, posix
          ini-values: opcache.enable_cli=1, memory_limit=2G
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run
        env:
          TIER: ${{ inputs.tier || 'mini' }}
          DRIVER: ${{ matrix.driver }}
          CACHE: ${{ matrix.cache }}
        run: php bench/bin/run.php --tier="$TIER" --driver="$DRIVER" --cache="$CACHE" --out="bench-$DRIVER-$CACHE"

      - name: Summary
        if: always()
        env:
          DRIVER: ${{ matrix.driver }}
          CACHE: ${{ matrix.cache }}
        run: if [[ -f "bench-$DRIVER-$CACHE.md" ]]; then cat "bench-$DRIVER-$CACHE.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.driver }}-${{ matrix.cache }}
          path: bench-*.*
          if-no-files-found: ignore
