name: Load bench

# Advisory: numbers of shared runners are noisy, so this never gates a merge. Run it by hand to get comparable JSON
# for two refs on the same runner type, or let the weekly run keep the harness exercised on PostgreSQL and Redis.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: Tier (smoke, mini, ci)
        type: choice
        options: [smoke, mini, ci]
        default: mini
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: ${{ matrix.driver }} · ${{ matrix.cache }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { driver: sqlite, cache: none }
          - { driver: pgsql, cache: none }
          - { driver: pgsql, cache: redis }
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: azguard_test
          POSTGRES_USER: azguard
          POSTGRES_PASSWORD: azguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U azguard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, pdo_pgsql, redis, pcntl, posix
          ini-values: opcache.enable_cli=1, memory_limit=2G
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run
        env:
          TIER: ${{ inputs.tier || 'mini' }}
          DRIVER: ${{ matrix.driver }}
          CACHE: ${{ matrix.cache }}
        run: php bench/bin/run.php --tier="$TIER" --driver="$DRIVER" --cache="$CACHE" --out="bench-$DRIVER-$CACHE"

      - name: Summary
        if: always()
        env:
          DRIVER: ${{ matrix.driver }}
          CACHE: ${{ matrix.cache }}
        run: cat "bench-$DRIVER-$CACHE.md" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.driver }}-${{ matrix.cache }}
          path: bench-*.*
          if-no-files-found: ignore
