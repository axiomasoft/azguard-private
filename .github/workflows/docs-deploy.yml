name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'composer.json'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-deploy.yml'
      - 'bin/docs-language-gate.sh'
      - 'bin/docs-php-version-gate.sh'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Documentation
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read

  # Only main reaches the deploy: the build uploads the Pages artifact for a push or a dispatch on main.
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
