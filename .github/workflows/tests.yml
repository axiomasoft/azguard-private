name: Tests

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml qualifies every tag with this workflow.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: P${{ matrix.php }} · L${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '^10.0'
            laravel_major: '12'
          - laravel: '13.*'
            testbench: '^11.0'
            laravel_major: '13'
        exclude:
          # PHP 8.5 is only supported by Laravel 13.
          - laravel: '12.*'
            php: '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Validate composer
        run: composer validate --strict

      - name: Install dependencies (${{ matrix.stability }})
        run: |
          set -Eeuo pipefail
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Audit resolved dependencies
        run: composer audit --locked --abandoned=fail

      - name: Scan resolved lock with OSV
        run: |
          set -Eeuo pipefail
          sha256sum composer.lock > "$RUNNER_TEMP/audited-lock.sha256"
          bash bin/security-tools.sh osv-scanner -- scan source --lockfile=composer.lock --config=.github/osv-scanner.toml
          sha256sum --check "$RUNNER_TEMP/audited-lock.sha256"

      - name: Retain solved dependency graph
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: composer-lock-php${{ matrix.php }}-laravel${{ matrix.laravel_major }}-${{ matrix.stability }}
          path: composer.lock
          if-no-files-found: error

      - name: Run tests
        run: vendor/bin/pest --ci --fail-on-skipped --exclude-group=engines --exclude-group=redis --exclude-group=replica --exclude-group=extended
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Record successful matrix row
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum --check "$RUNNER_TEMP/audited-lock.sha256"
          mkdir -p "$RUNNER_TEMP/matrix-row"
          cp composer.lock "$RUNNER_TEMP/matrix-row/composer.lock"
          jq -n --arg sha "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --arg name 'php${{ matrix.php }}-laravel${{ matrix.laravel_major }}-${{ matrix.stability }}' --arg lock_sha256 "$(sha256sum composer.lock | awk '{print $1}')" '{sha:$sha,run_id:$run_id,name:$name,result:"success",dependency_audit_passed:true,lock_sha256:$lock_sha256}' > "$RUNNER_TEMP/matrix-row/row.json"
      - name: Upload successful matrix row
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-row-${{ github.run_attempt }}-php${{ matrix.php }}-laravel${{ matrix.laravel_major }}-${{ matrix.stability }}
          path: ${{ runner.temp }}/matrix-row/
          if-no-files-found: error

  # The tests whose result depends on the engine (group `database`, tests/zones.json) on each server and on the two
  # newest Laravel majors; everything else runs once on SQLite above. The engine tests (races, replication of one
  # database) run sequentially after them. Parity runs seeds 1 and 2 here, all of them in tests-nightly.yml.
  test-db-matrix:
    name: DB lane · ${{ matrix.connection }} · L${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        connection: [pgsql, mysql, mariadb]
        laravel: ['12.*', '13.*']
        include:
          - connection: pgsql
            service: postgres
          - connection: mysql
            service: mysql
          - connection: mariadb
            service: mariadb
          - laravel: '12.*'
            testbench: '^10.0'
            laravel_major: '12'
          - laravel: '13.*'
            testbench: '^11.0'
            laravel_major: '13'
    env:
      PGSQL_PORT: 5432
      MYSQL_PORT: 3306
      MARIADB_PORT: 3307
      PGSQL_HOST: 127.0.0.1
      PGSQL_DATABASE: azguard_test
      PGSQL_USERNAME: azguard
      PGSQL_PASSWORD: azguard
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: azguard_test
      MYSQL_USERNAME: azguard
      MYSQL_PASSWORD: azguard
      MARIADB_HOST: 127.0.0.1
      MARIADB_DATABASE: azguard_test
      MARIADB_USERNAME: azguard
      MARIADB_PASSWORD: azguard
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Start disposable database (${{ matrix.connection }})
        run: docker compose up -d --wait --wait-timeout 120 ${{ matrix.service }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Get Composer archive cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-db-matrix-${{ hashFiles('composer.lock', '**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-db-matrix-
            ${{ runner.os }}-composer-

      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        run: |
          set -Eeuo pipefail
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Audit resolved dependencies
        run: composer audit --locked --abandoned=fail

      - name: Scan resolved lock with OSV
        run: |
          set -Eeuo pipefail
          sha256sum composer.lock > "$RUNNER_TEMP/audited-lock.sha256"
          bash bin/security-tools.sh osv-scanner -- scan source --lockfile=composer.lock --config=.github/osv-scanner.toml
          sha256sum --check "$RUNNER_TEMP/audited-lock.sha256"

      - name: Retain solved dependency graph
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: composer-lock-db-${{ matrix.connection }}-laravel${{ matrix.laravel_major }}
          path: composer.lock
          if-no-files-found: error

      - name: Database lane, 8 workers (${{ matrix.connection }})
        run: composer test:db -- ${{ matrix.connection }} --parallel=8

      - name: Engine qualification without skips (${{ matrix.connection }})
        run: composer test:db -- ${{ matrix.connection }} --engines

      - name: Record successful database row
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum --check "$RUNNER_TEMP/audited-lock.sha256"
          mkdir -p "$RUNNER_TEMP/matrix-row"
          cp composer.lock "$RUNNER_TEMP/matrix-row/composer.lock"
          jq -n --arg sha "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --arg name 'db-${{ matrix.connection }}-laravel${{ matrix.laravel_major }}' --arg lock_sha256 "$(sha256sum composer.lock | awk '{print $1}')" '{sha:$sha,run_id:$run_id,name:$name,result:"success",dependency_audit_passed:true,lock_sha256:$lock_sha256}' > "$RUNNER_TEMP/matrix-row/row.json"
      - name: Upload successful database row
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-row-${{ github.run_attempt }}-db-${{ matrix.connection }}-laravel${{ matrix.laravel_major }}
          path: ${{ runner.temp }}/matrix-row/
          if-no-files-found: error

      - name: Capture database service logs
        if: always()
        run: docker compose logs --no-color ${{ matrix.service }}

      - name: Stop disposable database
        if: always()
        run: docker compose stop ${{ matrix.service }}

  test-replica:
    name: PostgreSQL · authority replica
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Start isolated primary and streaming replica
        run: docker compose --profile authority-replica up -d --wait authority-primary authority-replica

      - name: Qualify real replica lag without skips
        run: composer test:replica

      - name: Capture replica service logs
        if: always()
        run: docker compose --profile authority-replica logs --no-color authority-primary authority-replica

      - name: Stop isolated replica services
        if: always()
        run: docker compose --profile authority-replica down

  test-redis:
    name: Redis · cross-process cache
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, redis
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Redis qualification suite
        run: composer test:redis
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests with coverage
        run: vendor/bin/pest --ci --fail-on-skipped --exclude-group=engines --exclude-group=redis --exclude-group=replica --exclude-group=extended --coverage --min=85 --coverage-clover=coverage.xml
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          XDEBUG_MODE: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        continue-on-error: true
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  consumer-fixture:
    name: Consumer archives · PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '12' }
          - { php: '8.3', laravel: '13' }
          - { php: '8.4', laravel: '12' }
          - { php: '8.4', laravel: '13' }
          - { php: '8.5', laravel: '13' }
    env:
      LARAVEL: ${{ matrix.laravel }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Qualify archives with both dependency policies
        run: bash bin/consumer-matrix.sh --source="$GITHUB_SHA" --pair='${{ matrix.php }}-${{ matrix.laravel }}' --output="$RUNNER_TEMP/consumer"

      - name: Retain consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-${{ matrix.php }}-${{ matrix.laravel }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consumer/
          if-no-files-found: error

  consumer-matrix:
    name: Consumer archive matrix completeness
    needs: [consumer-fixture]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: consumer-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consumer
          merge-multiple: true
      - run: bash bin/test-consumer-matrix.sh
      - run: bash bin/consumer-matrix.sh --verify="$RUNNER_TEMP/consumer"

  all:
    name: Tests · all lanes
    if: always()
    needs: [test, test-db-matrix, test-replica, test-redis, coverage, consumer-fixture, consumer-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -Eeuo pipefail
          for result in $RESULTS; do
            [[ "$result" == success ]] || { echo "::error::a required job ended with $result"; exit 1; }
          done
