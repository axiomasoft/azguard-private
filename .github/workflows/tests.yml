name: Tests

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # release.yml qualifies every tag with this workflow.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: P${{ matrix.php }} · L${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '11.*'
            testbench: '^9.0'
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'
        exclude:
          # PHP 8.5 is only supported by Laravel 13.
          - laravel: '11.*'
            php: '8.5'
          - laravel: '12.*'
            php: '8.5'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Validate composer
        run: composer validate --strict

      - name: Install dependencies (${{ matrix.stability }})
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --ci --fail-on-skipped --exclude-group=engines --exclude-group=redis --exclude-group=replica --exclude-group=extended
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  # The tests whose result depends on the engine (group `database`, tests/zones.json) on each server and on the two
  # newest Laravel majors; everything else runs once on SQLite above. The engine tests (races, replication of one
  # database) run sequentially after them. Parity runs seeds 1 and 2 here, all of them in tests-nightly.yml.
  test-db-matrix:
    name: DB lane · ${{ matrix.connection }} · L${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        connection: [pgsql, mysql, mariadb]
        laravel: ['12.*', '13.*']
        include:
          - connection: pgsql
            service: postgres
          - connection: mysql
            service: mysql
          - connection: mariadb
            service: mariadb
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'
    env:
      PGSQL_PORT: 5432
      MYSQL_PORT: 3306
      MARIADB_PORT: 3307
      PGSQL_HOST: 127.0.0.1
      PGSQL_DATABASE: azguard_test
      PGSQL_USERNAME: azguard
      PGSQL_PASSWORD: azguard
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: azguard_test
      MYSQL_USERNAME: azguard
      MYSQL_PASSWORD: azguard
      MARIADB_HOST: 127.0.0.1
      MARIADB_DATABASE: azguard_test
      MARIADB_USERNAME: azguard
      MARIADB_PASSWORD: azguard
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Start disposable database (${{ matrix.connection }})
        run: docker compose up -d --wait --wait-timeout 120 ${{ matrix.service }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Get Composer archive cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-db-matrix-${{ hashFiles('**/composer.json', '**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-db-matrix-
            ${{ runner.os }}-composer-

      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Database lane, 8 workers (${{ matrix.connection }})
        run: composer test:db -- ${{ matrix.connection }} --parallel=8

      - name: Engine qualification without skips (${{ matrix.connection }})
        run: composer test:db -- ${{ matrix.connection }} --engines

      - name: Capture database service logs
        if: always()
        run: docker compose logs --no-color ${{ matrix.service }}

      - name: Stop disposable database
        if: always()
        run: docker compose stop ${{ matrix.service }}

  test-replica:
    name: PostgreSQL · authority replica
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Start isolated primary and streaming replica
        run: docker compose --profile authority-replica up -d --wait authority-primary authority-replica

      - name: Qualify real replica lag without skips
        run: composer test:replica

      - name: Capture replica service logs
        if: always()
        run: docker compose --profile authority-replica logs --no-color authority-primary authority-replica

      - name: Stop isolated replica services
        if: always()
        run: docker compose --profile authority-replica down

  test-redis:
    name: Redis · cross-process cache
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, redis
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run Redis qualification suite
        run: composer test:redis
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: xdebug
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests with coverage
        run: vendor/bin/pest --ci --fail-on-skipped --exclude-group=engines --exclude-group=redis --exclude-group=replica --exclude-group=extended --coverage --min=85 --coverage-clover=coverage.xml
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          XDEBUG_MODE: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  consumer-fixture:
    name: Consumer fixture · built archives
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Core archive in a clean Laravel 13 app
        run: bash bin/consumer-fixture.sh --laravel=13

      - name: Core and Filament archives in a clean Laravel 13 app
        run: bash bin/consumer-fixture.sh --laravel=13 --with-filament

      # Blocking: the core archive without modules/ boots, migrates, passes the doctor, grants and checks (I13, I19).
      - name: Core archive without module roots in a clean Laravel 13 app
        run: bash bin/consumer-fixture.sh core-only --laravel=13

      # Blocking: Audit moved to its own archive keeps FQCNs, commands, migration basename and journal rows (I19).
      - name: Audit module relocation rehearsal in a clean Laravel 13 app
        run: bash bin/consumer-fixture.sh relocated-audit --laravel=13
