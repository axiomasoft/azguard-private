name: Release setup probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Verify split publication prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - name: Verify setup read token
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SETUP_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "$GH_TOKEN" ]] || { echo '::error::Setup read token unavailable.'; exit 1; }
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          gh api 'repos/axiomasoft/azguard-private/rulesets?per_page=100' --paginate --slurp > "$work/rulesets.json"
          jq -e 'all(.[]; type == "array")' "$work/rulesets.json" >/dev/null
          while IFS= read -r id; do gh api "repos/axiomasoft/azguard-private/rulesets/$id" >/dev/null; done < <(jq -r '.[][] | .id' "$work/rulesets.json")
          gh api repos/axiomasoft/azguard-private/private-vulnerability-reporting >/dev/null
          gh api repos/axiomasoft/azguard-private/environments/release >/dev/null
          gh api repos/axiomasoft/azguard-private/actions/secrets/MONOREPO_SPLIT_TOKEN >/dev/null
          gh api repos/axiomasoft/azguard-private/actions/secrets/RELEASE_SETUP_READ_TOKEN >/dev/null
          gh api repos/axiomasoft/azguard-private/actions/variables/SPLIT_ENABLED >/dev/null
          for repo in azguard-private azguard azguard-filament; do
            gh api "repos/axiomasoft/$repo" >/dev/null
            gh api "repos/axiomasoft/$repo/actions/variables/RELEASE_TAG_PUBLIC_KEY" >/dev/null
            gh api "repos/axiomasoft/$repo/actions/variables/RELEASE_TAG_SIGNER_FINGERPRINT" >/dev/null
            gh api "repos/axiomasoft/$repo/actions/runs?per_page=1" >/dev/null
          done
          for repo in azguard azguard-filament; do
            gh api "repos/axiomasoft/$repo/actions/secrets/PRIVATE_RELEASE_READ_TOKEN" >/dev/null
          done
      - name: Probe split push and dispatch permissions
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}
        run: |
          set -Eeuo pipefail
          [[ -n "$GH_TOKEN" && "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          work="$(mktemp -d)"
          ref="refs/heads/release-setup-probe/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          pending=''
          cleanup() {
            if [[ -n "$pending" ]]; then
              git -C "$work/probe" push --quiet --force-with-lease="$ref:$probe_sha" "https://x-access-token@github.com/axiomasoft/$pending.git" ":$ref" >/dev/null 2>&1 || true
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT
          printf '#!/bin/sh\nprintf "%%s\\n" "$GH_TOKEN"\n' > "$work/askpass"
          chmod 700 "$work/askpass"
          export GIT_ASKPASS="$work/askpass" GIT_TERMINAL_PROMPT=0
          git init -q "$work/probe"
          git -C "$work/probe" -c user.name='Release setup probe' -c user.email='release-setup@example.invalid' commit --allow-empty -qm 'Release setup probe'
          probe_sha="$(git -C "$work/probe" rev-parse HEAD)"
          for repo in azguard azguard-filament; do
            url="https://x-access-token@github.com/axiomasoft/$repo.git"
            [[ -z "$(git ls-remote --refs "$url" "$ref")" ]] || { echo '::error::Probe ref already exists.'; exit 1; }
            pending="$repo"
            git -C "$work/probe" push --quiet "$url" "$probe_sha:$ref"
            [[ "$(git ls-remote --refs "$url" "$ref")" == "$probe_sha"$'\t'"$ref" ]]
            git -C "$work/probe" push --quiet --force-with-lease="$ref:$probe_sha" "$url" ":$ref"
            pending=''
            gh workflow run attestation-setup.yml --repo "axiomasoft/$repo" --ref main
          done
