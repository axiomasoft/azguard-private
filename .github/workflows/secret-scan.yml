name: Secret scan

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scan:
    name: Secret scan (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        scope: [worktree, history]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify result checker and secret detection
        env:
          AZGUARD_TOOLS_DIR: ${{ runner.temp }}/security-tools
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 bin/test-security-results.py
          bash bin/test-security-gates.sh

      # History covers reachable commits and first-parent merge diffs, not other refs.
      # Reports are redacted; no config, ignore-file or inline suppressions apply.
      - name: Scan for secrets
        id: scan
        env:
          SCAN_SCOPE: ${{ matrix.scope }}
          AZGUARD_TOOLS_DIR: ${{ runner.temp }}/security-tools
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/secret-results"
          if [[ "$SCAN_SCOPE" == worktree ]]; then
            bash bin/security-tools.sh gitleaks -- dir --no-banner --redact --ignore-gitleaks-allow --gitleaks-ignore-path="$RUNNER_TEMP/secret-results" --timeout 600 --config=.gitleaks.toml --report-format=json --report-path="$RUNNER_TEMP/secret-results/report.json" .
          elif [[ "$SCAN_SCOPE" == history ]]; then
            test "$(git rev-parse --is-shallow-repository)" = false
            bash bin/security-tools.sh gitleaks -- git --no-banner --redact --ignore-gitleaks-allow --gitleaks-ignore-path="$RUNNER_TEMP/secret-results" --timeout 600 --config=.gitleaks.toml --log-opts="--all --full-history --diff-merges=first-parent" --report-format=json --report-path="$RUNNER_TEMP/secret-results/report.json" .
          else
            exit 1
          fi

      - name: Enforce report and bind it to the checked-out commit
        if: always()
        env:
          SCAN_SCOPE: ${{ matrix.scope }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: python3 bin/check-security-results.py --scanner "gitleaks-$SCAN_SCOPE" --outcome "$SCAN_OUTCOME" --sha "$GITHUB_SHA" --report-dir "$RUNNER_TEMP/secret-results" --metadata "$RUNNER_TEMP/secret-results/metadata.json"

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secret-scan-${{ matrix.scope }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secret-results/
          if-no-files-found: error
