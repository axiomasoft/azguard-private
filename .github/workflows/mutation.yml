name: Mutation Testing

# Release-blocking critical mutation (release.yml calls it with package: critical), weekly and on demand. The
# core and filament scopes stay manual. A run fails on runner errors or an unmet threshold.
on:
  workflow_call:
    inputs:
      package:
        description: Mutation scope (critical, core or filament)
        type: string
        default: critical
  workflow_dispatch:
    inputs:
      package:
        description: Mutation scope (critical, core or filament)
        type: choice
        options: [critical, core, filament]
        default: critical
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  mutation:
    name: Pest mutation (${{ inputs.package || 'critical' }})
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ inputs.package || 'critical' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: xdebug
          tools: composer:v2
        env:
          XDEBUG_MODE: coverage

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-mutation-${{ hashFiles('composer.lock', '**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-mutation-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Pest mutation gate
        run: composer "mutate:${PACKAGE}"
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          XDEBUG_MODE: coverage
