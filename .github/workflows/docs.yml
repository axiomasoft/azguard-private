name: Documentation

on:
  pull_request:
    branches: [main]
  # release.yml qualifies every tag and docs-deploy.yml builds main with this workflow; neither push nor dispatch runs it directly.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Docs lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check that the documentation is English-only
        run: bash bin/docs-language-gate.sh

      - name: Check docs PHP version matches composer floor
        run: bash bin/docs-php-version-gate.sh

  # Pull requests build too: a broken page must fail the PR, not the deploy after merge.
  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Resolve VitePress base from the repo name
        run: echo "VITEPRESS_BASE=/${GITHUB_REPOSITORY##*/}/" >> "$GITHUB_ENV"

      - name: Build VitePress
        run: npm run docs:build

      - name: Upload Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  all:
    name: Docs · lint and build
    if: always()
    needs: [lint, build]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -Eeuo pipefail
          for result in $RESULTS; do
            [[ "$result" == success ]] || { echo "::error::a required job ended with $result"; exit 1; }
          done
