name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'composer.json'
      - '.github/workflows/docs.yml'
      - 'bin/docs-language-gate.sh'
      - 'bin/docs-php-version-gate.sh'
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'composer.json'
      - '.github/workflows/docs.yml'
      - 'bin/docs-language-gate.sh'
      - 'bin/docs-php-version-gate.sh'
  workflow_dispatch:
  # release.yml qualifies every tag with this workflow: a call runs lint and build, never the deploy.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Docs lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check that the documentation is English-only
        run: bash bin/docs-language-gate.sh

      - name: Check docs PHP version matches composer floor
        run: bash bin/docs-php-version-gate.sh

  # Pull requests build too: a broken page must fail the PR, not the deploy after merge.
  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Resolve VitePress base from the repo name
        run: echo "VITEPRESS_BASE=/${GITHUB_REPOSITORY##*/}/" >> "$GITHUB_ENV"

      - name: Build VitePress
        run: npm run docs:build

      - name: Upload Pages artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vitepress/dist

  # Only a push or a manual run on main deploys; in a call from release.yml the event is the tag push, whose ref is the tag.
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
