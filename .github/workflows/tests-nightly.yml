name: Tests (nightly)

# The depth that a pull request leaves out: the scale tests (group `extended`, R58) and the whole parity range (seeds
# 1-8) on every server. A pull request already runs the same mechanisms at a smaller size, so a failure here points at
# size or at a seed, not at a mechanism that was never checked. A release waits for a green run of this workflow.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  # release.yml qualifies every tag with this workflow.
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tests-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extended:
    name: Extended · scale tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run the extended tests
        run: composer test:extended
        env:
          AZGUARD_FULL_SEEDS: '1'
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  db-full:
    name: DB lane, all parity seeds · ${{ matrix.connection }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        connection: [pgsql, mysql, mariadb]
        include:
          - connection: pgsql
            service: postgres
          - connection: mysql
            service: mysql
          - connection: mariadb
            service: mariadb
    env:
      PGSQL_PORT: 5432
      MYSQL_PORT: 3306
      MARIADB_PORT: 3307
      PGSQL_HOST: 127.0.0.1
      PGSQL_DATABASE: azguard_test
      PGSQL_USERNAME: azguard
      PGSQL_PASSWORD: azguard
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: azguard_test
      MYSQL_USERNAME: azguard
      MYSQL_PASSWORD: azguard
      MARIADB_HOST: 127.0.0.1
      MARIADB_DATABASE: azguard_test
      MARIADB_USERNAME: azguard
      MARIADB_PASSWORD: azguard
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Start disposable database (${{ matrix.connection }})
        run: docker compose up -d --wait --wait-timeout 120 ${{ matrix.service }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Database lane with parity seeds 1-8 (${{ matrix.connection }})
        run: composer test:db -- ${{ matrix.connection }} --parallel=8 --full

      - name: Capture database service logs
        if: always()
        run: docker compose logs --no-color ${{ matrix.service }}

      - name: Stop disposable database
        if: always()
        run: docker compose stop ${{ matrix.service }}
