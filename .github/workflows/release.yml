name: Release

# A GitHub release and the package split happen only for a tag whose commit passed, in this run, every qualification
# workflow and the compatibility comparison against its baseline (conditions 9 and 10 of the 1.0 release gate). The
# called workflows run on the tagged commit; `split` and `release` need all of them. There is no other trigger: a tag
# cannot bypass the graph, and a pre-release tag runs the same graph.

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Tests
    uses: $/.github/workflows/tests.yml
    permissions:
      contents: read

  static:
    name: Static analysis
    uses: $/.github/workflows/static-analysis.yml
    permissions:
      contents: read

  style:
    name: Code style
    uses: $/.github/workflows/code-style.yml
    permissions:
      contents: read

  docs:
    name: Documentation
    uses: $/.github/workflows/docs.yml
    permissions:
      contents: read

  nightly:
    name: Tests (nightly depth)
    uses: $/.github/workflows/tests-nightly.yml
    permissions:
      contents: read

  compat:
    name: Compatibility
    uses: $/.github/workflows/compatibility.yml
    permissions:
      contents: read

  workers:
    name: Persistent workers and memory
    uses: $/.github/workflows/workers.yml
    with:
      memory: true
    permissions:
      contents: read

  security:
    name: Security
    uses: $/.github/workflows/security.yml
    permissions:
      contents: read

  codeql:
    name: CodeQL
    uses: $/.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  zizmor:
    name: Zizmor
    uses: $/.github/workflows/zizmor.yml
    permissions:
      contents: read

  secret-scan:
    name: Secret scan
    uses: $/.github/workflows/secret-scan.yml
    permissions:
      contents: read

  advisories:
    name: Release advisory reports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Prepare advisory evidence
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/advisories"
      - name: Composer advisory report
        id: composer
        run: composer audit --locked --abandoned=fail --format=json > "$RUNNER_TEMP/advisories/composer.json"
      - name: Install docs toolchain
        run: npm ci --ignore-scripts
      - name: npm advisory report
        id: npm
        run: npm audit --json > "$RUNNER_TEMP/advisories/npm.json"
      - name: OSV advisory report
        id: osv
        if: always()
        run: bash bin/security-tools.sh osv-scanner -- scan source --lockfile=composer.lock --lockfile=package-lock.json --config=.github/osv-scanner.toml --format=json > "$RUNNER_TEMP/advisories/osv.json"
      - name: Bind advisory outcomes
        if: always()
        env:
          COMPOSER_OUTCOME: ${{ steps.composer.outcome }}
          NPM_OUTCOME: ${{ steps.npm.outcome }}
          OSV_OUTCOME: ${{ steps.osv.outcome }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/advisories"
          jq -n --arg sha "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --arg composer "$COMPOSER_OUTCOME" --arg npm "$NPM_OUTCOME" --arg osv "$OSV_OUTCOME" '{sha:$sha,run_id:$run_id,outcomes:{composer:$composer,npm:$npm,osv:$osv}}' > "$RUNNER_TEMP/advisories/metadata.json"
      - name: Upload advisory reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-advisories-${{ github.run_attempt }}
          path: ${{ runner.temp }}/advisories/
          if-no-files-found: error

  validate:
    name: Validate before release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: zip, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Validate every package manifest
        run: |
          set -Eeuo pipefail
          composer validate --strict --no-check-version
          for pkg in packages/core packages/filament; do
            echo "::group::composer validate $pkg"
            composer validate --strict --no-check-version --no-check-lock --working-dir="$pkg"
            echo "::endgroup::"
          done

      - name: Fail if the Filament package does not pin core to self.version
        run: |
          set -Eeuo pipefail
          if ! grep -Eq '"axiomasoft/azguard"[[:space:]]*:[[:space:]]*"self\.version"' packages/filament/composer.json; then
            echo "::error::axiomasoft/azguard-filament must require axiomasoft/azguard as self.version."
            exit 1
          fi

      - name: Require an annotated tag
        env:
          TAG: ${{ github.ref_name }}
          TAGGED_SHA: ${{ github.sha }}
          RELEASE_TAG_PUBLIC_KEY: ${{ vars.RELEASE_TAG_PUBLIC_KEY }}
          RELEASE_TAG_SIGNER_FINGERPRINT: ${{ vars.RELEASE_TAG_SIGNER_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          test "$(git cat-file -t "refs/tags/${TAG}")" = tag || { echo "::error::${TAG} is a lightweight tag: release tags are annotated."; exit 1; }
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "${TAGGED_SHA}" || { echo "::error::${TAG} does not resolve to the candidate SHA ${TAGGED_SHA}."; exit 1; }
          test "$(git rev-parse HEAD)" = "${TAGGED_SHA}" || { echo "::error::checkout does not match the candidate SHA ${TAGGED_SHA}."; exit 1; }
          [[ "$RELEASE_TAG_SIGNER_FINGERPRINT" =~ ^([0-9A-F]{40}|[0-9A-F]{64})$ && -n "$RELEASE_TAG_PUBLIC_KEY" ]] || { echo '::error::Configure the trusted release tag key and signing fingerprint.'; exit 1; }
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$RELEASE_TAG_PUBLIC_KEY" | gpg --batch --quiet --import
          git verify-tag --raw "refs/tags/${TAG}" 2> "$GNUPGHOME/status" || { echo '::error::Tag signature verification failed.'; exit 1; }
          mapfile -t signatures < <(awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" {print $3}' "$GNUPGHOME/status")
          [[ ${#signatures[@]} == 1 && "${signatures[0]}" == "$RELEASE_TAG_SIGNER_FINGERPRINT" ]] || { echo '::error::Tag signer does not match the trusted fingerprint.'; exit 1; }

      - name: Require the tagged commit to be reachable from main
        env:
          TAGGED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${TAGGED_SHA}" FETCH_HEAD || { echo "::error::${TAGGED_SHA} is not reachable from main."; exit 1; }

      - name: Require the first stable tag to change only the baseline over the candidate
        env:
          TAG: ${{ github.ref_name }}
          TAGGED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          # Only the first stable release has the C+1 rule; a later one is compared with the previous stable tag.
          earlier="$(git tag --merged "${TAGGED_SHA}" --list 'v[1-9]*.[0-9]*.[0-9]*' | grep -E '^v[1-9][0-9]*\.[0-9]+\.[0-9]+$' | grep -vxF "${TAG}" || true)"
          if [[ "${TAG}" =~ ^v[1-9][0-9]*\.[0-9]+\.[0-9]+$ && -z "${earlier}" ]]; then
            candidate="$(jq -r .candidate compatibility.json)"
            changed="$(git diff --name-only "${candidate}" "${TAGGED_SHA}" -- . ':!plans' ':!release-evidence')"
            test "${changed}" = "compatibility.json" || { echo "::error::a stable tag may change only compatibility.json over the candidate ${candidate}; changed:"; echo "${changed}"; exit 1; }
          fi

      - name: Require changelog section in tagged commit
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          bash bin/release-preflight.sh "${version}" "${GITHUB_SHA}"

      - name: Verify release preflight fixtures
        run: bash bin/test-release-preflight.sh

  validate-consumers:
    name: Consumer archives · L${{ matrix.laravel }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        laravel: [12, 13]
    env:
      LARAVEL: ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, zip
          tools: composer:v2
          coverage: none

      - name: Core archive in a clean Laravel app
        run: bash bin/consumer-fixture.sh --laravel="$LARAVEL" --version="${GITHUB_REF_NAME#v}"

      - name: Core archive without module roots in a clean Laravel app
        run: bash bin/consumer-fixture.sh core-only --laravel="$LARAVEL" --version="${GITHUB_REF_NAME#v}"

      - name: Audit module relocation rehearsal in a clean Laravel app
        run: bash bin/consumer-fixture.sh relocated-audit --laravel="$LARAVEL" --version="${GITHUB_REF_NAME#v}"

  artifacts:
    name: Release artifacts
    needs: [validate, validate-consumers, tests, static, style, docs, nightly, compat, security, codeql, zizmor, secret-scan, workers, advisories]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: zip, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Build the archives, the SBOMs and SHA256SUMS
        run: bash bin/release-artifacts.sh "${GITHUB_REF_NAME#v}" dist

      - name: Upload the artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-artifacts-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error

  gate:
    name: Release evidence gate
    if: always()
    needs: [validate, validate-consumers, tests, static, style, docs, nightly, compat, security, codeql, zizmor, secret-scan, artifacts, workers, advisories]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download this run's evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/release-evidence
      - name: Evaluate release evidence
        env:
          JOBS: ${{ toJSON(needs) }}
        run: |
          set -Eeuo pipefail
          tag_sha="$(git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}")"
          php bin/collect-release-evidence.php "$RUNNER_TEMP/release-evidence" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$tag_sha" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/release-evidence.json"
          php bin/verify-release-evidence.php --candidate-source "$GITHUB_SHA" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$RUNNER_TEMP/release-evidence.json"

  split:
    name: Split validated packages
    needs: [gate, validate, validate-consumers, tests, static, style, docs, nightly, compat, security, codeql, zizmor, secret-scan, artifacts, workers, advisories]
    uses: $/.github/workflows/split.yml
    secrets:
      MONOREPO_SPLIT_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}
      RELEASE_SETUP_READ_TOKEN: ${{ secrets.RELEASE_SETUP_READ_TOKEN }}
    permissions:
      contents: read

  provenance:
    name: Verify split mapping and attest final artifacts
    needs: [gate, split]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    outputs:
      core_sha: ${{ steps.verify.outputs.core_sha }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download candidate artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts-${{ github.run_attempt }}
          path: dist
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: zip
          tools: composer:v2
          coverage: none
      - name: Verify split trees and archives
        id: verify
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}
        run: bash bin/verify-release-split.sh "$GITHUB_SHA" "$GITHUB_REF_NAME" dist
      - name: Verify final artifact attestations and mapping
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}
          CORE_SHA: ${{ steps.verify.outputs.core_sha }}
          RELEASE_TAG_PUBLIC_KEY: ${{ vars.RELEASE_TAG_PUBLIC_KEY }}
          RELEASE_TAG_SIGNER_FINGERPRINT: ${{ vars.RELEASE_TAG_SIGNER_FINGERPRINT }}
        run: php bin/verify-release-evidence.php --candidate-artifacts "$GITHUB_SHA" "$GITHUB_REF_NAME" dist "$CORE_SHA" "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

  publish-packages:
    name: Publish verified package tags
    needs: [gate, split, provenance]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Publish only the verified split commits
        env:
          SPLIT_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}
          CORE_SHA: ${{ needs.provenance.outputs.core_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$CORE_SHA" =~ ^[0-9a-f]{40}$ && -n "$SPLIT_TOKEN" ]]
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          printf '#!/bin/sh\nprintf "%%s\\n" "$SPLIT_TOKEN"\n' > "$askpass"
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          for entry in "azguard:$CORE_SHA"; do
            repo="${entry%%:*}"
            expected="${entry#*:}"
            url="https://x-access-token@github.com/axiomasoft/$repo.git"
            staging="refs/heads/release-candidate/$GITHUB_REF_NAME/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            git init -q "$RUNNER_TEMP/$repo"
            git -C "$RUNNER_TEMP/$repo" fetch --quiet --depth=1 "$url" "$staging"
            [[ "$(git -C "$RUNNER_TEMP/$repo" rev-parse 'FETCH_HEAD^{commit}')" == "$expected" ]]
            existing="$(git ls-remote --refs --tags "$url" "refs/tags/$GITHUB_REF_NAME")"
            [[ -z "$existing" || "$existing" == "$expected"$'\t'"refs/tags/$GITHUB_REF_NAME" ]] || { echo "::error::Existing $repo tag differs from verified split commit"; exit 1; }
          done
          for entry in "azguard:$CORE_SHA"; do
            repo="${entry%%:*}"
            expected="${entry#*:}"
            url="https://x-access-token@github.com/axiomasoft/$repo.git"
            existing="$(git ls-remote --refs --tags "$url" "refs/tags/$GITHUB_REF_NAME")"
            if [[ -z "$existing" ]]; then
              git -C "$RUNNER_TEMP/$repo" push "$url" "$expected:refs/tags/$GITHUB_REF_NAME"
            else
              [[ "$existing" == "$expected"$'\t'"refs/tags/$GITHUB_REF_NAME" ]]
            fi
          done
          # Read the final tag back after pushing. This tag is lightweight,
          # so their direct object IDs are their peeled commit IDs.
          for entry in "azguard:$CORE_SHA"; do
            repo="${entry%%:*}"
            expected="${entry#*:}"
            url="https://x-access-token@github.com/axiomasoft/$repo.git"
            actual="$(git ls-remote --refs --tags "$url" "refs/tags/$GITHUB_REF_NAME")"
            [[ "$actual" == "$expected"$'\t'"refs/tags/$GITHUB_REF_NAME" ]] || { echo "::error::Published split tag does not resolve to the verified commit: $repo"; exit 1; }
          done
          # Delete only the staging refs whose exact commits were verified.
          for entry in "azguard:$CORE_SHA"; do
            repo="${entry%%:*}"
            expected="${entry#*:}"
            url="https://x-access-token@github.com/axiomasoft/$repo.git"
            staging="refs/heads/release-candidate/$GITHUB_REF_NAME/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            git -C "$RUNNER_TEMP/$repo" push --force-with-lease="$staging:$expected" "$url" ":$staging"
          done

  release:
    name: Create GitHub Release
    needs: [gate, validate, validate-consumers, tests, static, style, docs, nightly, compat, security, codeql, zizmor, secret-scan, artifacts, split, workers, advisories, provenance, publish-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts-${{ github.run_attempt }}
          path: dist

      - name: Release notes from the CHANGELOG section of this version
        run: bash bin/release-notes.sh "${GITHUB_REF_NAME#v}" "${GITHUB_SHA}" > CHANGES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          files: |
            dist/*.zip
            dist/*.cdx.json
            dist/*.lock
            dist/mapping-*.json
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
