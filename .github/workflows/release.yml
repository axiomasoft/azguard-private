name: Release

# A GitHub release and the package split happen only for a tag whose commit passed, in this run, every qualification
# workflow and the compatibility comparison against its baseline (conditions 9 and 10 of the 1.0 release gate). The
# called workflows run on the tagged commit; `split` and `release` need all of them. There is no other trigger: a tag
# cannot bypass the graph, and a pre-release tag runs the same graph.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  static:
    name: Static analysis
    uses: ./.github/workflows/static-analysis.yml
    permissions:
      contents: read

  style:
    name: Code style
    uses: ./.github/workflows/code-style.yml
    permissions:
      contents: read

  # A call never deploys (docs.yml gates its deploy job to main), but a called workflow may not declare a job with more
  # permissions than its caller grants, so the call grants the deploy job's permissions it does not use.
  docs:
    name: Documentation
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  nightly:
    name: Tests (nightly depth)
    uses: ./.github/workflows/tests-nightly.yml
    permissions:
      contents: read

  compat:
    name: Compatibility
    uses: ./.github/workflows/compatibility.yml
    permissions:
      contents: read

  validate:
    name: Validate before release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Validate every package manifest
        run: |
          composer validate --strict --no-check-version
          for pkg in packages/core packages/filament; do
            echo "::group::composer validate $pkg"
            composer validate --strict --no-check-version --no-check-lock --working-dir="$pkg"
            echo "::endgroup::"
          done

      - name: Fail if the Filament package does not pin core to self.version
        run: |
          if ! grep -Eq '"axiomasoft/azguard"[[:space:]]*:[[:space:]]*"self\.version"' packages/filament/composer.json; then
            echo "::error::axiomasoft/azguard-filament must require axiomasoft/azguard as self.version."
            exit 1
          fi

      - name: Core archive in a clean Laravel 13 app
        run: bash bin/consumer-fixture.sh --laravel=13 --version="${GITHUB_REF_NAME#v}"

      - name: Core and Filament archives in a clean Laravel 13 app
        run: bash bin/consumer-fixture.sh --laravel=13 --version="${GITHUB_REF_NAME#v}" --with-filament

      - name: Core archive without module roots in a clean Laravel 13 app
        run: bash bin/consumer-fixture.sh core-only --laravel=13 --version="${GITHUB_REF_NAME#v}"

      - name: Audit module relocation rehearsal in a clean Laravel 13 app
        run: bash bin/consumer-fixture.sh relocated-audit --laravel=13 --version="${GITHUB_REF_NAME#v}"

      - name: Require changelog section in tagged commit
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash bin/release-preflight.sh "${version}" "${GITHUB_SHA}"

      - name: Verify release preflight fixtures
        run: bash bin/test-release-preflight.sh

  split:
    name: Split validated packages
    needs: [validate, tests, static, style, docs, nightly, compat]
    uses: ./.github/workflows/split.yml
    secrets: inherit
    permissions:
      contents: read

  release:
    name: Create GitHub Release
    needs: [validate, tests, static, style, docs, nightly, compat, split]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release notes from the CHANGELOG section of this version
        run: bash bin/release-notes.sh "${GITHUB_REF_NAME#v}" "${GITHUB_SHA}" > CHANGES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
